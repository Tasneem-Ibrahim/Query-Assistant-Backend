[project]
name = "query-assistant-backend"
version = "1.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.18",
    "python-dotenv>=1.0",
    "pymupdf>=1.24",
    "pillow>=11.3",
    "httpx>=0.27",
    "qdrant-client>=1.9",
    "openai>=1.40",
    "numpy>=1.26",
]

[project.optional-dependencies]
local = ["sentence-transformers>=3.0", "pytesseract>=0.3.10", "streamlit>=1.35", "reportlab>=4.0"]

[tool.vercel]
entrypoint = "api_server:app"
